    <path d="M 55 65 C 68 70 85 68 100 74" fill="none" stroke="#1B4332" stroke-width="3" stroke-linecap="round" />
    <path d="M 48 68 C 38 76 28 80 18 83" fill="none" stroke="#1B4332" stroke-width="2" stroke-linecap="round" />
    <path d="M 62 68 C 72 76 82 80 92 83" fill="none" stroke="#1B4332" stroke-width="2" stroke-linecap="round" />
    <path d="M 55 65 C 53 74 55 82 54 88" fill="none" stroke="#1B4332" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
