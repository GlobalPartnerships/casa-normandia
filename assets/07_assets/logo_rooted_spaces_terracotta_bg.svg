<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&amp;family=Outfit:wght@300;400;500;600&amp;display=swap');
      .txt-rooted-terra {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 38px;
        font-weight: 600;
        fill: #1B4332;
        letter-spacing: 2px;
      }
      .txt-sub-terra {
        font-family: 'Outfit', sans-serif;
        font-size: 10px;
        font-weight: 600;
        fill: #FAF8F5;
        letter-spacing: 6px;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- FONDO TERRACOTA DE LA TIERRA -->
  <rect width="100%" height="100%" rx="14" fill="#C86D51" />

  <!-- ISOTIPO: EL BROTE EN VERDE BOSQUE -->
  <g transform="translate(195, 20)">
    <path d="M 55 65 C 53 50 51 32 54 20" fill="none" stroke="#1B4332" stroke-width="4.2" stroke-linecap="round" />
    <path d="M 52 35 C 32 30 20 40 22 50 C 32 54 48 45 52 35 Z" fill="#1B4332" />
    <path d="M 54 20 C 58 5 74 -2 80 5 C 82 18 68 28 54 20 Z" fill="#1B4332" />

    <path d="M 55 65 C 42 70 25 68 10 74" fill="none" stroke="#1B4332" stroke-width="3" stroke-linecap="round" />
    <path d="M 55 65 C 68 70 85 68 100 74" fill="none" stroke="#1B4332" stroke-width="3" stroke-linecap="round" />
    <path d="M 48 68 C 38 76 28 80 18 83" fill="none" stroke="#1B4332" stroke-width="2" stroke-linecap="round" />
    <path d="M 62 68 C 72 76 82 80 92 83" fill="none" stroke="#1B4332" stroke-width="2" stroke-linecap="round" />
    <path d="M 55 65 C 53 74 55 82 54 88" fill="none" stroke="#1B4332" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- TEXTO TIPOGRÁFICO CENTRADO -->
  <text x="250" y="145" class="txt-rooted-terra" text-anchor="middle">Rooted Spaces</text>
  <text x="250" y="170" class="txt-sub-terra" text-anchor="middle">CONSCIOUS HOSPITALITY</text>
</svg>
